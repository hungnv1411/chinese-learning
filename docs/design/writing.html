<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luyện viết chữ 你 · Tiếng Trung</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .focus-body.wide { max-width: 980px; }
  .wgrid { display: grid; gap: var(--space-6); }
  @media (min-width: 900px) { .wgrid { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
</style>
</head>
<body>
<div class="focus">
  <header class="focus-top" style="max-width:980px">
    <a class="icon-btn" href="lesson.html" aria-label="Quay lại bài học"><i data-i="back"></i></a>
    <h1 class="grow" style="font-size:var(--text-xl)">Viết chữ <span class="hz" lang="zh">你</span></h1>
  </header>

  <main class="focus-body wide" id="main">
    <div class="seg" id="modes" role="tablist" aria-label="Chế độ luyện viết" data-od-id="write-modes">
      <button role="tab" data-m="watch" aria-selected="true">Xem</button>
      <button role="tab" data-m="trace" aria-selected="false">Viết theo</button>
      <button role="tab" data-m="free" aria-selected="false">Tự viết</button>
    </div>

    <div class="wgrid">
      <section class="stack-4" aria-label="Ô tập viết">
        <p class="center lead" id="prompt">Xem thứ tự nét của chữ</p>
        <div class="tzg" id="pad" data-od-id="stroke-pad"><svg viewBox="0 0 100 100" id="svg" role="img" aria-label="Chữ 你 trong ô tập viết"></svg></div>
        <div class="row between" style="max-width:360px;margin:0 auto;width:100%">
          <span class="small" id="strokeinfo">Nét <b>0</b> / 7</span>
          <div class="row" style="gap:var(--space-2)">
            <button class="icon-btn" id="replay" aria-label="Phát lại" style="color:var(--blue-deep)"><i data-i="replay"></i></button>
            <button class="icon-btn" data-say="你" aria-label="Nghe chữ 你" style="color:var(--blue-deep)"><i data-i="volume"></i></button>
          </div>
        </div>
        <div class="note" id="feedback" role="status" hidden></div>
      </section>

      <aside class="stack-4" aria-label="Thông tin chữ">
        <div class="card">
          <p class="eyebrow" style="margin-bottom:8px">Các nét</p>
          <div class="strokes" id="strokes"></div>
        </div>
        <div class="card soft">
          <div class="row" style="gap:var(--space-4)">
            <span class="hz hz-md t3" lang="zh">你</span>
            <div class="grow"><b class="py t3">nǐ</b> · <span class="hv">nhĩ</span><div>you</div></div>
          </div>
          <p class="small" style="margin-top:var(--space-3)">Bộ <b lang="zh">亻</b> (nhân đứng, “người”) + <b lang="zh">尔</b></p>
        </div>
        <div class="row" style="gap:var(--space-3)">
          <button class="btn btn-secondary btn-sm" id="hintbtn" style="flex:1">Gợi ý</button>
          <button class="btn btn-secondary btn-sm" id="undo" style="flex:1">Xóa nét</button>
        </div>
        <p class="small muted" id="rule">Sai 3 lần ở một nét thì nét tiếp theo tự hiện gợi ý, rồi bạn có thể xem lại hoạt ảnh. Bạn sẽ không bị kẹt.</p>
      </aside>
    </div>
  </main>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var S = [
    { d: 'M34 16 Q28 30 16 44', g: '丿', n: 'phẩy', tip: 'Nét phẩy kéo từ trên xuống, cong sang trái.' },
    { d: 'M26 34 V88', g: '丨', n: 'sổ', tip: 'Nét sổ kéo thẳng từ trên xuống dưới.' },
    { d: 'M62 14 Q55 26 40 34', g: '丿', n: 'phẩy', tip: 'Nét phẩy kéo từ trên xuống, cong sang trái.' },
    { d: 'M44 36 H84 Q84 46 78 50', g: '乛', n: 'ngang gập', tip: 'Nét gập 乛 viết từ trái sang phải rồi gập xuống.' },
    { d: 'M64 38 V84 Q64 90 56 88', g: '亅', n: 'sổ móc', tip: 'Nét sổ móc kéo thẳng xuống rồi móc nhẹ sang trái.' },
    { d: 'M56 54 Q50 68 40 78', g: '丿', n: 'phẩy', tip: 'Nét phẩy kéo từ trên xuống, cong sang trái.' },
    { d: 'M72 58 L84 72', g: '丶', n: 'chấm', tip: 'Nét chấm ngắn, đi xuống bên phải.' }
  ];
  var svg = document.getElementById('svg'), pad = document.getElementById('pad'), fb = document.getElementById('feedback'),
      info = document.getElementById('strokeinfo'), prompt = document.getElementById('prompt'), strokesEl = document.getElementById('strokes'),
      hintBtn = document.getElementById('hintbtn'), undoBtn = document.getElementById('undo'), rule = document.getElementById('rule');
  var mode = 'watch', cur = 0, fails = 0, timers = [], guide, done, hint, user = null, pts = [];

  function el(cls, d) { var p = document.createElementNS(NS, 'path'); p.setAttribute('class', cls); p.setAttribute('d', d); p.setAttribute('pathLength', '1'); return p; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function renderChips() {
    strokesEl.innerHTML = S.map(function (s, i) { return '<span lang="zh" class="' + (i < cur ? 'on' : i === cur && mode !== 'watch' ? 'now' : '') + '" title="' + s.n + '">' + s.g + '</span>'; }).join('');
    info.innerHTML = 'Nét <b>' + Math.min(cur + (mode === 'watch' ? 0 : 1), 7) + '</b> / 7' + (cur < 7 ? ' · <span class="muted">' + S[Math.min(cur, 6)].g + ' ' + S[Math.min(cur, 6)].n + '</span>' : '');
    if (mode === 'watch') info.innerHTML = 'Nét <b>' + cur + '</b> / 7' + (cur ? ' · <span class="muted">' + S[cur - 1].g + ' ' + S[cur - 1].n + '</span>' : '');
  }
  function say(msg, kind) { fb.hidden = !msg; fb.className = 'note' + (kind ? ' ' + kind : ''); fb.textContent = msg || ''; }

  function setup() {
    clearTimers(); svg.innerHTML = ''; cur = 0; fails = 0; say('');
    guide = document.createElementNS(NS, 'g'); done = document.createElementNS(NS, 'g'); hint = document.createElementNS(NS, 'g');
    S.forEach(function (s) { guide.appendChild(el('guide', s.d)); });
    if (mode === 'free') guide.style.display = 'none';
    svg.appendChild(guide); svg.appendChild(done); svg.appendChild(hint);
    hintBtn.disabled = undoBtn.disabled = mode === 'watch';
    document.getElementById('replay').setAttribute('aria-label', mode === 'watch' ? 'Phát lại hoạt ảnh' : 'Làm lại từ đầu');
    prompt.textContent = mode === 'watch' ? 'Xem thứ tự nét của chữ' : mode === 'trace' ? 'Viết theo nét mờ' : 'Viết chữ có nghĩa “you”';
    rule.hidden = mode === 'watch';
    if (mode === 'watch') play(); else renderChips();
  }
  function play() {
    clearTimers(); done.innerHTML = ''; cur = 0; renderChips();
    S.forEach(function (s, i) {
      timers.push(setTimeout(function () {
        var p = el('anim', s.d); p.style.strokeDasharray = 1; p.style.strokeDashoffset = 1; p.style.transition = 'stroke-dashoffset .55s ease';
        done.appendChild(p); p.getBoundingClientRect(); p.style.strokeDashoffset = 0; cur = i + 1; renderChips();
      }, 700 * i + 200));
    });
  }

  /* Stroke grading: start/end proximity + mean distance to the template path (100×100 space) */
  function templatePts(d) {
    var p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); var L = p.getTotalLength(), a = [];
    for (var k = 0; k <= 24; k++) { var q = p.getPointAtLength(L * k / 24); a.push([q.x, q.y]); }
    return a;
  }
  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function judge(u, d) {
    if (u.length < 3) return false;
    var t = templatePts(d), len = 0, i;
    for (i = 1; i < u.length; i++) len += dist(u[i - 1], u[i]);
    var tl = 0; for (i = 1; i < t.length; i++) tl += dist(t[i - 1], t[i]);
    if (len < tl * 0.45) return false;
    if (dist(u[0], t[0]) > 24 || dist(u[u.length - 1], t[t.length - 1]) > 26) return false;
    var sum = 0; u.forEach(function (p) { var m = 999; t.forEach(function (q) { m = Math.min(m, dist(p, q)); }); sum += m; });
    return sum / u.length < 13;
  }
  function pos(e) { var r = pad.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100]; }
  pad.addEventListener('pointerdown', function (e) {
    if (mode === 'watch' || cur >= S.length) return;
    pad.setPointerCapture(e.pointerId); pts = [pos(e)];
    user = document.createElementNS(NS, 'path'); user.setAttribute('class', 'user'); svg.appendChild(user);
  });
  pad.addEventListener('pointermove', function (e) { if (!user) return; pts.push(pos(e)); user.setAttribute('d', 'M' + pts.map(function (p) { return p.join(' '); }).join(' L')); });
  function end() {
    if (!user) return;
    var u = user; user = null;
    if (judge(pts, S[cur].d)) {
      u.remove(); var p = el('done', S[cur].d); done.appendChild(p); hint.innerHTML = ''; cur++; fails = 0; renderChips();
      if (cur >= S.length) { say('Tuyệt vời! Bạn đã viết đúng cả 7 nét của chữ 你.', 'ok'); prompt.textContent = 'Hoàn thành'; }
      else say('');
    } else {
      u.setAttribute('class', 'wrong'); setTimeout(function () { u.remove(); }, 650); fails++;
      say('Nét ' + (cur + 1) + ' chưa đúng · ' + S[cur].tip, 'bad');
      if (fails >= 3) showHint();
    }
  }
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);

  function showHint() {
    if (cur >= S.length) return; hint.innerHTML = ''; var h = el('hint', S[cur].d); h.style.strokeDasharray = '0.02 0.05'; hint.appendChild(h);
  }
  hintBtn.addEventListener('click', showHint);
  undoBtn.addEventListener('click', function () {
    if (cur === 0) return; cur--; done.removeChild(done.lastChild); fails = 0; hint.innerHTML = ''; say(''); renderChips(); prompt.textContent = prompt.textContent === 'Hoàn thành' ? 'Viết chữ có nghĩa “you”' : prompt.textContent;
  });
  document.getElementById('replay').addEventListener('click', setup);
  document.getElementById('modes').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-m]'); if (!b) return; mode = b.dataset.m;
    document.querySelectorAll('#modes button').forEach(function (o) { o.setAttribute('aria-selected', String(o === b)); }); setup();
  });
  setup();
})();
</script>
</body>
</html>
