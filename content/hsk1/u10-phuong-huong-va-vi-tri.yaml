# Sinh bằng `clp author-unit` (author_unit/1); bản rà soát và máy kiểm tra xem _meta/hsk1-u10.json.
id: hsk1-u10
stage: hsk1
order: 10
title: Phương hướng và vị trí
description: Biết mô tả vị trí trên, dưới, trước, sau, trái, phải và các hướng đông, tây, nam, bắc.
lessons:
- id: hsk1-u10-l01
  title: Trên, dưới, trong, ngoài, giữa
  grammar: hsk1-g001
  new_words:
  - 上
  - 下
  - 里
  - 外
  - 中
  - 中间
  sentences:
  - id: s-hsk1-u10-001
    zh: 杯子里有水。
    en: There is water in the glass.
    pinyin: bēi zi lǐ yǒu shuǐ
    tatoeba_id: 10961067
  - id: s-hsk1-u10-002
    zh: 杯子上有字。
    en: There are words on the cup.
    pinyin: Bēizi shang yǒu zì.
  - id: s-hsk1-u10-003
    zh: 我们中间谁会说汉语？
    en: Which of us can speak Chinese?
    pinyin: Wǒmen zhōngjiān shéi huì shuō Hànyǔ?
  tips:
    里: 'Lỗi hay gặp: nói theo tiếng Việt "trong nhà" thành ~~里家~~. Tiếng Trung đặt từ chỉ vị trí SAU danh
      từ: 家里 (nhà-trong), 杯子里 (cốc-trong). Đứng sau danh từ, 里 thường đọc nhẹ thành li.'
    上: 'sh trong 上 là âm uốn lưỡi: cong đầu lưỡi lên gần vòm miệng, giống chữ "s" khi người miền Trung,
      miền Nam đọc phân biệt s với x. Đứng sau danh từ (杯子上) thường đọc nhẹ thành shang.'
    外: 外 có âm Hán Việt là ngoại. Bạn đã gặp 外国 (nước ngoài) và 外语 (ngoại ngữ) – cùng nghĩa "bên ngoài".
    中间: '中 có âm Hán Việt là trung: chữ là một ô vuông có nét sổ xuyên qua chính giữa. zh đọc gần như
      "tr" tiếng Việt, không bật hơi.'
- id: hsk1-u10-l02
  title: Bên trên, bên dưới, bên trong, bên ngoài, bên cạnh
  new_words:
  - 上边
  - 下边
  - 里边
  - 外边
  - 旁边
  sentences:
  - id: s-hsk1-u10-004
    zh: 他在她的旁边。
    en: He's at her side.
    pinyin: tā zài tā de páng biān
    tatoeba_id: 712989
  - id: s-hsk1-u10-005
    zh: 你的钱包在杯子下边。
    en: Your wallet is under the cup.
    pinyin: Nǐ de qiánbāo zài bēizi xiàbian.
  - id: s-hsk1-u10-006
    zh: 商店里边有什么？
    en: What is inside the shop?
    pinyin: Shāngdiàn lǐbian yǒu shénme?
  tips:
    旁边: 'Trật tự ngược với tiếng Việt: "A ở bên cạnh B" → A 在 B 旁边 (B đứng trước 旁边). Sai: ~~我在旁边书店~~
      → đúng: 我在书店旁边。'
    上边: '边 trong 上边, 下边, 里边, 外边 thường đọc thanh nhẹ (bian), nhưng trong 旁边 lại đọc rõ thanh 1: pángbiān.
      旁 có âm Hán Việt là bàng.'
    里边: 'Các từ có 边 có thể đứng một mình: 他在外边 (anh ấy ở bên ngoài). Còn 里, 上 đơn lẻ thường phải gắn
      sau danh từ: 家里, 杯子上.'
- id: hsk1-u10-l03
  title: Trước, sau, trái, phải
  new_words:
  - 前
  - 后
  - 左
  - 右
  - 前边
  - 后边
  - 左边
  - 右边
  sentences:
  - id: s-hsk1-u10-007
    zh: 我在右边。
    en: I am on the right.
    pinyin: wǒ zài yòu biān
    tatoeba_id: 810662
  - id: s-hsk1-u10-008
    zh: 我家后边有一个书店。
    en: There is a bookstore behind my house.
    pinyin: Wǒ jiā hòubian yǒu yí ge shūdiàn.
  - id: s-hsk1-u10-009
    zh: 左边是我哥哥，右边是我弟弟。
    en: On the left is my older brother, on the right is my younger brother.
    pinyin: Zuǒbian shì wǒ gēge, yòubian shì wǒ dìdi.
  tips:
    左: '左 có âm Hán Việt là tả, 右 có âm Hán Việt là hữu – như trong "tả hữu". Mẹo nhớ chữ: 左 có 工 bên
      dưới, 右 có 口 (miệng) bên dưới – tay phải cầm đồ ăn đưa lên miệng.'
    前: '前 có âm Hán Việt là tiền, 后 có âm Hán Việt là hậu – như "tiền hậu". Bạn đã học 前天 (hôm kia), 后天
      (ngày kia): ở đây 前/后 chỉ thời gian.'
    左边: 'zuǒ: z đọc như "ch" nhẹ không bật hơi, thanh 3 xuống thấp rồi lên (khác dấu hỏi tiếng Việt ở
      chỗ phải xuống sâu hơn). Đi với 边 thanh nhẹ nên chỉ cần hạ thấp: zuǒbian.'
    后: 'h tiếng Trung phát ra từ cuống họng, có tiếng cọ xát rõ hơn "h" tiếng Việt, gần với "kh" nhẹ:
      hòu.'
- id: hsk1-u10-l04
  title: Đông, tây, nam, bắc
  new_words:
  - 东
  - 南
  - 西
  - 北
  - 东边
  - 南边
  - 西边
  - 北边
  sentences:
  - id: s-hsk1-u10-010
    zh: 北京在中国的北边。
    en: Beijing is in the north of China.
    pinyin: Běijīng zài Zhōngguó de běibian.
  - id: s-hsk1-u10-011
    zh: 你家在东边还是西边？
    en: Is your home on the east side or the west side?
    pinyin: Nǐ jiā zài dōngbian háishi xībian?
  - id: s-hsk1-u10-012
    zh: 商店在饭店南边。
    en: The shop is south of the restaurant.
    pinyin: Shāngdiàn zài fàndiàn nánbian.
  tips:
    东: 'Người Việt nói "đông tây nam bắc", còn người Trung quen nói theo thứ tự 东南西北 (nghĩa: đông, nam,
      tây, bắc). 东 có âm Hán Việt là đông, 南 có âm Hán Việt là nam, 西 có âm Hán Việt là tây.'
    西: 'x trong 西 xī: đặt mặt lưỡi gần vòm miệng, môi dẹt như cười, nghe giống "x" Việt nhưng mềm hơn.
      Ghép 东西 (dōngxi) bạn đã học nghĩa là "đồ vật".'
    北: 北京 = kinh đô phía bắc. Lưu ý 北 thanh 3 + 京 thanh 1 không biến điệu; còn 北边 đọc běibian, 边 thanh
      nhẹ.
- id: hsk1-u10-cp
  type: checkpoint
  title: Ôn tập chủ đề
