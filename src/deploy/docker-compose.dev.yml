# Chồng lên docker-compose.yml cho môi trường dev.
# Seed dữ liệu mẫu (Phát âm + 2 chủ đề HSK 1) nối vào sau khi có pipeline (01) và nội dung (02);
# trước đó DB để trống.
services:
  web:
    build:
      target: dev
    command: pnpm -F @clp/web dev --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      CI: "true"
    # Dùng chung volume node_modules với service `node` (cài một lần, dùng cho cả hai).
    volumes:
      - ../..:/repo
      - node_modules:/repo/node_modules
      - web_node_modules:/repo/src/apps/web/node_modules
      - core_node_modules:/repo/src/packages/core/node_modules
      - e2e_node_modules:/repo/src/e2e/node_modules
      - web_next:/repo/src/apps/web/.next
    working_dir: /repo
    # Chỉ dev: mở web ra máy host (127.0.0.1) để xem bằng trình duyệt, không qua Caddy.
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      start_period: 60s
  db:
    # Chỉ dev: mở cổng DB ra máy host (127.0.0.1) để chạy pipeline và drizzle-kit.
    ports:
      - '127.0.0.1:5432:5432'

  # Công cụ chạy lệnh một lần (không khởi động khi `up`): docker compose ... run --rm node pnpm test
  node:
    profiles: [tools]
    image: node:22-slim
    working_dir: /repo
    environment:
      CI: 'true'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      npm_config_store_dir: /pnpm-store
      DATABASE_URL: postgres://${POSTGRES_USER:-clp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clp}
      # test schema tự tạo/xóa một database riêng trên server này
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-clp}:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    # edge để tải gói từ Internet, internal để tới db
    networks: [edge, internal]
    volumes:
      - ../..:/repo
      - node_modules:/repo/node_modules
      - web_node_modules:/repo/src/apps/web/node_modules
      - core_node_modules:/repo/src/packages/core/node_modules
      - e2e_node_modules:/repo/src/e2e/node_modules
      - pnpm_store:/pnpm-store
    entrypoint: ['sh', '-c', 'corepack enable && exec "$@"', '--']

  py-pipeline:
    profiles: [tools]
    image: python:3.12-slim
    working_dir: /repo/src/pipeline
    depends_on:
      db:
        condition: service_healthy
    # edge để tải gói và dữ liệu nguồn, internal để tới db
    networks: [edge, internal]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clp}
      # test tích hợp tự tạo/xóa một database riêng trên server này
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-clp}:${POSTGRES_PASSWORD}@db:5432/postgres
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # Soạn nội dung bằng AI (02-5…): qua Claude Code CLI, xem dịch vụ py-claude bên dưới
      CLP_AUTHOR_MODEL: ${CLP_AUTHOR_MODEL:-claude-opus-5-5}
      CLP_REVIEW_MODEL: ${CLP_REVIEW_MODEL:-claude-sonnet-5-5}
      CLP_AUTHOR_EFFORT: ${CLP_AUTHOR_EFFORT:-high}
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    volumes:
      - ../..:/repo
      - pipeline_venv:/venv
      - uv_cache:/root/.cache/uv
    entrypoint: ['sh', '-c', 'pip install -q uv && exec uv "$@"', '--']

  # Như py-pipeline, thêm Claude Code CLI của máy host (đã đăng nhập) để chạy `clp plan-units`,
  # `clp author-unit`. Chỉ tạo dịch vụ này khi cần: nếu host chưa có file CLI hoặc đăng nhập,
  # Docker không khởi động được container.
  #   src/deploy/dev.sh run --rm py-claude run clp plan-units hsk1
  py-claude:
    extends:
      service: py-pipeline
    profiles: [tools]
    environment:
      CLP_CLAUDE_BIN: /usr/local/bin/claude
      HOME: /root
    volumes:
      - ${CLP_CLAUDE_HOST_BIN:-${HOME}/.local/bin/claude}:/usr/local/bin/claude:ro
      - ${CLP_CLAUDE_HOST_CREDENTIALS:-${HOME}/.claude/.credentials.json}:/root/.claude/.credentials.json

  py-speech:
    profiles: [tools]
    build:
      context: ../services/speech
      dockerfile: Dockerfile.dev
    working_dir: /repo/src/services/speech
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    volumes:
      - ../..:/repo
      - speech_venv:/venv
      - uv_cache:/root/.cache/uv
      - hf_cache:/root/.cache/huggingface

volumes:
  hf_cache:
  node_modules:
  web_node_modules:
  core_node_modules:
  e2e_node_modules:
  web_next:
  pnpm_store:
  pipeline_venv:
  speech_venv:
  uv_cache:
