# Chạy từ gốc repo:
#   docker compose --env-file .env -f src/deploy/docker-compose.yml up -d
# Dev: thêm -f src/deploy/docker-compose.dev.yml
name: chinese-learning

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Tên miền chỉ đến từ cấu hình (D16). Mặc định localhost (HTTPS tự ký).
      CADDY_SITE: ${CADDY_SITE:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge, internal]

  web:
    build:
      context: ../..
      dockerfile: src/apps/web/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clp}:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@db:5432/${POSTGRES_DB:-clp}
      SPEECH_URL: http://speech:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [edge, internal]

  # Chỉ mạng nội bộ: không có `ports`, không nối vào mạng edge (architecture §1).
  speech:
    build:
      context: ../services/speech
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    tmpfs:
      - /dev/shm:size=256m # file ghi âm chỉ ở bộ nhớ, xóa ngay sau khi chấm
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [internal]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-clp}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clp} -d ${POSTGRES_DB:-clp}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
    internal: true # speech và db chỉ ở đây: không ra Internet, không truy cập được từ host
