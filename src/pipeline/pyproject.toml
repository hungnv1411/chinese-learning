[project]
name = "clp-pipeline"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "psycopg[binary]>=3.2", "pyyaml>=6", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
clp = "clp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clp"]

[tool.ruff]
line-length = 100
